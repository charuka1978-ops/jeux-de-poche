        ctx.fillStyle = PIX; ctx.fillRect(0, gy, W, 3);
        // tremplins de neige
        ramps.forEach(r => {
          const x = r * S - camX;
          if (x < -50 || x > W + 10) return;
          ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + 5 * S, gy); ctx.lineTo(x + 5 * S, gy - 2.2 * S); ctx.fill();
        });
        // serpents enroulés (ressorts)
        snakes.forEach(s => {
          const x = s * S - camX + 1 * S;
          if (x < -40 || x > W + 40) return;
          const squash = boing > 15 && Math.abs(p.x - s) < 60 ? 1.5 : 1;  // il se détend
          ctx.fillStyle = PIX;
          [[13, 5], [10, 5], [7, 4.5]].forEach(([rx, ry], i) => {
            ctx.beginPath(); ctx.ellipse(x, gy - 4 - i * 7 * squash, rx, ry, 0, 0, 7); ctx.fill();
            ctx.fillStyle = LCD;
            ctx.fillRect(x - rx + 3, gy - 5 - i * 7 * squash, rx * 2 - 6, 1.5);   // anneaux
            ctx.fillStyle = PIX;
          });
          const hy = gy - 4 - 3 * 7 * squash;                                   // tête
          ctx.beginPath(); ctx.ellipse(x + 3, hy, 6, 4.5, 0, 0, 7); ctx.fill();
          ctx.fillRect(x + 8, hy + 1, 5, 1.5); ctx.fillRect(x + 12, hy - 0.5, 2, 1.5); ctx.fillRect(x + 12, hy + 2, 2, 1.5); // langue
          ctx.fillStyle = LCD; ctx.fillRect(x + 4, hy - 2, 2, 2);
          ctx.fillStyle = PIX;
        });
        // grands oiseaux
        ctx.strokeStyle = PIX; ctx.lineCap = 'round';
        birds.forEach(b => {
          const x = b.x * S - camX, y = BASE - b.y * S + camY;
          if (x < -40 || x > W + 40 || y < -40 || y > W + 20) return;
          const flap = Math.sin(b.ph) * 10;
          ctx.fillStyle = PIX;
          ctx.beginPath(); ctx.ellipse(x, y, 11, 5, 0, 0, 7); ctx.fill();                       // corps
          ctx.beginPath(); ctx.arc(x + 11, y - 3, 4.5, 0, 7); ctx.fill();                       // tête
          ctx.beginPath(); ctx.moveTo(x + 15, y - 4); ctx.lineTo(x + 22, y - 2); ctx.lineTo(x + 15, y - 1); ctx.fill(); // bec
          ctx.fillStyle = LCD; ctx.fillRect(x + 11, y - 5, 2, 2);
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(x - 2, y - 2); ctx.quadraticCurveTo(x - 14, y - 14 - flap, x - 30, y - 6 - flap * 1.6);
          ctx.moveTo(x + 2, y - 2); ctx.quadraticCurveTo(x - 4, y - 16 - flap, x + 4, y - 26 - flap * 1.4);
          ctx.stroke();
          if (carry && carry.bird === b) {                                                       // pattes qui tiennent
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x - 3, y + 4); ctx.lineTo(x - 3, y + 10); ctx.moveTo(x + 3, y + 4); ctx.lineTo(x + 3, y + 10); ctx.stroke();
          }
        });
        ctx.lineCap = 'butt';
        if (carry) {
          ctx.font = '24px VT323, monospace'; ctx.textBaseline = 'top';
          ctx.fillStyle = PIX;
          ctx.fillText('EN TAXI AÉRIEN !', 10, 10 + 0);
        }
        if (boing > 0) {
          ctx.font = '28px VT323, monospace'; ctx.textBaseline = 'top';
          ctx.fillText('BOING !', p.x * S - camX - 10, BASE - p.y * S + camY - 60);
        }
        // bornes tous les 50 m
        ctx.font = '20px VT323, monospace'; ctx.textBaseline = 'top';
        for (let m = Math.floor(camX / S / 50) * 50; m * S - camX < W; m += 50) {
          if (m === 0) continue;
          const x = m * S - camX;
          ctx.fillRect(x, gy - 12, 2, 12);
          ctx.fillText(m + ' m', x + 4, gy + 24);
        }
        // record
        const b = g.prevBest;
        if (b > 0) {
          const x = b * S - camX;
          if (x > 0 && x < W) {
            for (let y = gy - 70; y < gy; y += 8) ctx.fillRect(x, y, 2, 4);
            ctx.fillText('RECORD', x + 4, gy - 70);
          }
        }
        // catapulte
        const cx = -camX;
        ctx.fillRect(cx + 2, gy - 6, 26, 6);
        ctx.fillRect(cx + 12, gy - 14, 6, 8);
        // visée et jauge
        const sx = p.x * S - camX, sy = BASE - p.y * S + camY;
        if (phase === 'aim' || phase === 'power') {
          const a = angle * Math.PI / 180;
          for (let d = 22; d < 90; d += 10) ctx.fillRect(sx + Math.cos(a) * d - 2, sy - Math.sin(a) * d - 2, 4, 4);
          if (phase === 'power') {
            ctx.strokeStyle = PIX; ctx.lineWidth = 2;
            ctx.strokeRect(W - 34, 40, 18, 170);
            ctx.fillRect(W - 30, 44 + 162 * (1 - power), 10, 162 * power);
            ctx.fillText('FORCE', W - 50, 216);
          } else ctx.fillText(Math.round(angle) + '°', sx + 30, sy - 110);
        }
        let rot;
        if (phase !== 'fly') rot = -Math.PI / 2;
        else if (carry) rot = -Math.PI / 2 + Math.sin(carry.bird.ph * 0.5) * 0.15;
        else if (p.y > 0.05) rot = -Math.atan2(p.vy, p.vx);
        else rot = 0;
        const lift = Math.abs(Math.sin(rot)) * 13 + Math.abs(Math.cos(rot)) * 8;
        penguin(sx + 12, sy - (phase === 'fly' ? lift : 6), rot);
      }
    };
    return g;
  }

  /* ---------- Moteur commun ---------- */
  const games = {serpent: Snake(), souris: Mouse(), pingouin: Penguin(), cible: Target(), planeur: Glider(), briques: Bricks(), glacons: Ice(), memoire: Memory(), sudoku: Sudoku(), morpion: TicTac(), sauvetage: Rescue(), chat: Cat()};
  const bests = {};
  Object.values(games).forEach(g => bests[g.key] = parseInt(store.get(g.key, '0'), 10) || 0);
  let current = store.get('console-jeu', 'serpent');
  if (!games[current]) current = 'serpent';
  let G = games[current];
  let state = 'idle', last = 0, acc = 0;

  const ov = $('overlay');
  function show(title, text, cta) {
    $('ovTitle').textContent = title; $('ovText').textContent = text; $('ovCta').textContent = cta;
    ov.hidden = false;
  }
  let recordAtStart = 0;
  function hud() {
    if (G.score > bests[G.key]) { bests[G.key] = G.score; store.set(G.key, G.score); }
    $('score').textContent = G.status();
    $('best').textContent = 'RECORD ' + pad3(bests[G.key]) + (G.unit ? 'M' : '');
  }

  function loop(t) {
    if (state !== 'run') return;
    acc += t - last; last = t;
    if (acc > 400) acc = 400;
    while (acc >= G.interval() && state === 'run') {
      acc -= G.interval();
      const r = G.step();
      hud();
      if (r === 'over' || r === 'win' || r === 'done') { finish(r); break; }
      if (r === 'hit' || r === 'level') { acc = -700; break; }
    }
    G.draw();
    if (state === 'run') requestAnimationFrame(loop);
  }
  function start() {
    if (state === 'pause') return resume();
    recordAtStart = bests[G.key];
    G.reset(); state = 'run'; ov.hidden = true; hud();
    $('play').textContent = 'REJOUER'; $('pause').textContent = 'Pause';
    last = performance.now(); acc = 0; requestAnimationFrame(loop);
    wake();
  }
  function pause() {
    if (state === 'run') {
      state = 'pause'; $('pause').textContent = 'Reprendre';
      show('PAUSE', 'Score actuel : ' + G.score, 'Touche REPRENDRE');
    } else if (state === 'pause') resume();
  }
  function resume() {
    state = 'run'; ov.hidden = true; $('pause').textContent = 'Pause';
    last = performance.now(); acc = 0; requestAnimationFrame(loop);
  }
  function finish(r) {
    state = 'over'; G.draw(); buzz([60, 40, 120]);
    const u = G.unit || '';
    const rec = G.score > recordAtStart;
    const title = r === 'win' ? 'BRAVO' : r === 'done' ? G.endTitle : 'PERDU';
    const label = G.unit ? 'Distance : ' : 'Score : ';
    show(title, label + G.score + u + (rec ? ' · nouveau record !' : ' · Record : ' + bests[G.key] + u), 'Touche JOUER');
    if (G.score > 0) showPseudoDialog(G.key.replace('-best', ''), G.score, u, rec);
  }

  function showPseudoDialog(game, score, unit, isRecord) {
    $('pseudoDialog').querySelector('h2').textContent = isRecord ? 'RECORD !' : 'TON SCORE';
    $('pseudoScore').textContent = (unit ? 'Distance : ' : 'Score : ') + score + unit;
    $('pseudoInput').value = store.get('last-pseudo', '');
    $('pseudoDialog').hidden = false;
    setTimeout(() => $('pseudoInput').focus(), 50);
    const close = () => { $('pseudoDialog').hidden = true; };
    const submit = () => {
      const p = $('pseudoInput').value.trim();
      if (!p) { $('pseudoInput').focus(); return; }
      store.set('last-pseudo', p);
      close();
      window.open(lbSubmitUrl(game, p, score), '_blank');
    };
    $('pseudoSubmit').onclick = submit;
    $('pseudoSkip').onclick = close;
    $('pseudoInput').onkeydown = e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') close(); };
  }

  async function showLeaderboard() {
    if (state === 'run') pause();
    $('lbOverlay').hidden = false;
    const sel = $('lbGameSel');
    sel.innerHTML = '';
    const gameKeys = Object.keys(games);
    let activeGame = current;
    gameKeys.forEach(key => {
      const b = document.createElement('button');
      b.textContent = games[key].title;
      b.setAttribute('aria-pressed', String(key === activeGame));
      b.onclick = () => {
        sel.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        activeGame = key;
        loadLbTable(key, games[key].unit);
      };
      sel.appendChild(b);
    });
    loadLbTable(activeGame, games[activeGame].unit);
  }

  async function loadLbTable(game, unit) {
    const body = $('lbBody'), msg = $('lbMsg');
    body.innerHTML = '';
    msg.textContent = '';
    body.innerHTML = `<tr><td class="lb-empty" colspan="3">Chargement…</td></tr>`;
    const rows = await lbFetch(game);
    if (!rows.length) {
      body.innerHTML = `<tr><td class="lb-empty" colspan="3">Aucun score pour l'instant — sois le premier !</td></tr>`;
      return;
    }
    const u = unit || '';
    body.innerHTML = rows.map((r, i) => `<tr>
      <td class="lb-rank">${i + 1}</td>
      <td>${r.pseudo}</td>
      <td class="lb-score">${r.score}${u}</td>
    </tr>`).join('');
    msg.textContent = 'Top 10 mondial · scores mis à jour en ~1 min';
  }
  function select(name) {
    current = name; G = games[name]; store.set('console-jeu', name);
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.game === name)));
    $('menuCurrent').textContent = document.querySelector('.tab[data-game="' + name + '"] b').textContent;
    state = 'idle'; G.reset(); G.draw(); hud();
    $('play').textContent = 'JOUER'; $('pause').textContent = 'Pause';
    show(G.title, G.intro, 'Touche JOUER');
  }
  function turn(x, y) { if (state === 'run') G.turn(x, y); }

  let lock = null;
  async function wake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') pause(); });

  const menuBtn = $('menuBtn'), menuList = $('menuList');
  function menu(open) {
    menuList.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open));
    if (open && state === 'run') pause();
  }
  menuBtn.addEventListener('click', e => { e.stopPropagation(); menu(menuList.hidden); });
  document.addEventListener('click', e => { if (!menuList.hidden && !e.target.closest('.menu')) menu(false); });
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    menu(false);
    if (b.dataset.game !== current) select(b.dataset.game);
  }));
  $('play').addEventListener('click', start);
  $('pause').addEventListener('click', pause);
  const dirs = {'b-up': [0, -1], 'b-down': [0, 1], 'b-left': [-1, 0], 'b-right': [1, 0]};
  Object.entries(dirs).forEach(([id, [x, y]]) => {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); input.hx = x; input.hy = y; input.pad = true; turn(x, y); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => {
      if (input.hx === x && input.hy === y) { input.hx = 0; input.hy = 0; input.pad = false; }
    }));
  });
  document.addEventListener('keyup', e => {
    if ((e.key === 'ArrowLeft' || e.key === 'q') && input.hx === -1) input.hx = 0;
    if ((e.key === 'ArrowRight' || e.key === 'd') && input.hx === 1) input.hx = 0;
  });
  function dragTo(e) {
    if (state !== 'run' || !G.drag) return;
    const r = cv.getBoundingClientRect();
    G.drag((e.clientX - r.left) * W / r.width);
  }
  document.addEventListener('keydown', e => {
    const map = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], z: [0, -1], s: [0, 1], q: [-1, 0], d: [1, 0]};
    if (G.digit && state === 'run' && /^[0-9]$/.test(e.key)) { G.digit(+e.key); return; }
    if (G.digit && state === 'run' && (e.key === 'Backspace' || e.key === 'Delete')) { G.digit(0); return; }
    if (map[e.key]) { e.preventDefault(); if (map[e.key][0]) input.hx = map[e.key][0]; turn(...map[e.key]); }
    else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'run') G.action ? G.action() : pause(); else start();
    }
  });

  let sx = 0, sy = 0, tracking = false, swiped = false;
  const stage = document.querySelector('.stage');
  stage.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY; tracking = true; swiped = false;
    dragTo(e);
    if (state === 'run' && G.action && !G.swipe) { G.action(); tracking = false; }
  });
  stage.addEventListener('pointermove', e => {
    dragTo(e);
    if (!tracking) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    swiped = true;
    if (!G.action || G.swipe) Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
    sx = e.clientX; sy = e.clientY;
  });
  stage.addEventListener('pointerup', e => {
    if (tracking) {
      if (state !== 'run') start();
      else if (G.tap && !swiped) {
        const r = cv.getBoundingClientRect();
        G.tap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * W / r.height);
      }
      else if (G.action && !swiped) G.action();
    }
    tracking = false;
  });
  stage.addEventListener('pointercancel', () => tracking = false);
  document.addEventListener('touchmove', e => { if (e.target.closest('.stage, .dpad')) e.preventDefault(); }, {passive: false});

  $('lbBtn').addEventListener('click', showLeaderboard);
  $('lbClose').addEventListener('click', () => { $('lbOverlay').hidden = true; });

  select(current);
})();
</script>

</body>
